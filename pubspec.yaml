name: location_picker_flutter_map
description: Package that provides Place search and Location picker for flutter maps with a lot of customizations using Open Street Map
version: 3.5.0
homepage: https://github.com/Michael-M-aher/location_picker_flutter_map

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.1.0
  location: ^10.0.2
  http: ^1.1.0
  intl: ^0.20.2
  latlong2: ^0.9.0
  url_launcher: ^6.2.1
  flutter_map_location_marker: ^10.3.0
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.2
  material_ui: ^1.11.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
